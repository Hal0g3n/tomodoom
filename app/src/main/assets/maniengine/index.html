<!doctype html>
<!--
  Tomodoom pet page (CLAUDE.md §5.1). Each pet comes from a Maniengine export: models/<pet>.js is
  GENERATED from it by tools/maniengine/extract_model.py (don't edit it by hand). ?pet=<id> picks the
  pet (a PETS id in pet-scene.js; the app passes the PetSpecies chosen at onboarding); without it
  the page shows DEFAULT_PET (the rabbit).
  This page owns the camera, lighting loop and the app contract:
    - reads window.tomodoomPetState at startup and listens for "tomodoom:petstate";
    - mood drives the idle animation, equipped items toggle the add-ons below;
    - reads window.tomodoomFrame and listens for "tomodoom:frame": while the host animates the pet
      and its pages it gives a rect (CSS px) to draw the pet into; the rest of the canvas stays
      transparent. A frame only applies while the page's size equals its hostW x hostH, and its
      lift (0-1) says how much to raise the pet clear of a health bar below it.
  tomodoom-touch "centre": one-finger drags starting in the model box (window.tomodoomTouchBox, set by
  the host) turn the pet. Fast flicks and drags starting outside the box swipe between tabs. Two
  fingers pinch-zoom (the host keeps multi-touch gestures away from the tab pager).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="tomodoom-touch" content="centre">
  <title>Tomodoom pet</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; transition: filter .6s; touch-action: none; }
    #error { position: absolute; inset: auto 0 12px; text-align: center; font: 13px sans-serif;
      color: #8C8F92; }
  </style>
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
</head>
<body>
<div id="error"></div>
<script type="module">
import * as THREE from 'three';
import { buildPetScene, loadPetModel } from './pet-scene.js';

// --- Scene, built exactly as the export does it (camera first, so override child paths match) ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 100);
scene.add(camera);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const { id: petId, model } = await loadPetModel(new URLSearchParams(location.search).get('pet'));
const { pet, head, petBox, ADDONS } = buildPetScene(THREE, scene, renderer, model, petId);

// --- App contract: tomodoom:petstate ---
let mood = 'okay';
function applyState(s) {
  if (!s) return;
  mood = s.fainted ? 'fainted' : s.mood;
  const ids = Object.values(s.equipped || {}).map(item => item.id);
  for (const id in ADDONS) ADDONS[id].visible = ids.includes(id);
  renderer.domElement.style.filter = { struggling: 'saturate(.55)', fainted: 'grayscale(.85)' }[mood] || '';
}
addEventListener('tomodoom:petstate', e => applyState(e.detail));
applyState(window.tomodoomPetState);

// --- Camera: frame the pet (+ the near rug) for whatever aspect the viewport (or frame) has ---
const TALL_ASPECT = .8, TALL_BLEND = .15, TALL_LIFT = .08, MIN_ZOOM = .75, MAX_ZOOM = 3;
// Host frame: { x, y, w, h, r, lift, hostW, hostH } (CSS px; lift 0-1), or null.
let hostFrame = window.tomodoomFrame || null;
const activeFrame = (w, h) => {
  const f = hostFrame;
  return f && Math.abs(f.hostW - w) <= 1 && Math.abs(f.hostH - h) <= 1 && f.w > 0 && f.h > 0 ? f : null;
};
const drawSize = new THREE.Vector2();
function fit() {
  const w = document.documentElement.clientWidth, h = document.documentElement.clientHeight;
  if (!w || !h) return;  // detached while moving between pages: keep the last good framing
  const f = activeFrame(w, h), fx = f ? f.x : 0, fy = f ? f.y : 0, fw = f ? f.w : w, fh = f ? f.h : h;
  const size = petBox.getSize(new THREE.Vector3()), centre = petBox.getCenter(new THREE.Vector3());
  camera.aspect = fw / fh;
  const vFov = THREE.MathUtils.degToRad(camera.fov) / 2;
  const fitH = (size.y * .75) / Math.tan(vFov), fitW = (size.x * 1.1) / (Math.tan(vFov) * camera.aspect);
  const dist = Math.max(fitH, fitW, 2.5);
  camera.position.set(0, centre.y + dist * .18, centre.z + dist);
  camera.lookAt(0, centre.y - size.y * .08, centre.z);
  // Sit the pet higher, clear of the health bar floating below it: as much as the host's frame
  // says (it blends this with the frame, so the pet never dips), else in tall (full-page) viewports.
  const lift = TALL_LIFT * (f && typeof f.lift === 'number' ? THREE.MathUtils.clamp(f.lift, 0, 1)
    : 1 - THREE.MathUtils.smoothstep(camera.aspect, TALL_ASPECT - TALL_BLEND, TALL_ASPECT));
  if (lift > 0) camera.setViewOffset(fw, fh, 0, fh * lift, fw, fh);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  // Resizing reallocates the drawing buffer, so only do it when the size really changed.
  if (renderer.getSize(drawSize).x !== w || drawSize.y !== h) renderer.setSize(w, h);
  renderer.setViewport(fx, h - fy - fh, fw, fh);  // WebGL counts y from the bottom
  renderer.setScissor(fx, h - fy - fh, fw, fh);
  renderer.setScissorTest(!!f);
  renderer.domElement.style.clipPath = f
    ? `inset(${fy}px ${w - fx - fw}px ${h - fy - fh}px ${fx}px round ${f.r || 0}px)` : '';
  renderer.render(scene, camera);  // same frame as the resize, so no frame shows the old aspect
}
addEventListener('tomodoom:frame', e => { hostFrame = e.detail || null; fit(); });
new ResizeObserver(fit).observe(document.documentElement);
fit();

// --- Touch: one finger in the model box turns the pet; two fingers pinch to zoom ---
// camera.zoom scales the picture uniformly, so the model is never distorted.
// Speeds are in viewport (frame) widths per second, so a swipe feels the same at any size.
const SPEED_WINDOW_MS = 100, SLOW_SPEED = .5, FAST_SPEED = 3, SLOW_GAIN = .75, FAST_GAIN = 1.75;
const MIN_FLING = .3, MAX_FLING = 14, FLING_DECAY = 1.2, TAB_HANDOVER_MS = 300;
// A held turn is eased in over ~70 ms rather than in one frame; a release this long after the last
// move means the finger was held still, so the pet doesn't coast.
const CATCH_UP_RATE = 14, STILL_MS = 80;
// A flick that changes tab spins the pet one full turn in the flick's direction, easing out.
const FLICK_SPIN_SEC = .8;
// Mirrors ManiengineProtocol.TAB_FLICK_WINDOW_MS / TAB_FLICK_MIN_DP_PER_SEC (CSS px = dp): change both
// together. While a young drag is this fast it may still become a tab flick, which the app hands to the
// pager (pointercancel), so its turn is held back instead of spinning the pet and snapping it back.
const FLICK_WINDOW_MS = 200, FLICK_PX_PER_SEC = 1200, FLICK_HOLD_FRACTION = .5;
const pointers = new Map();
let pinch = null, spin = null, spinVelocity = 0, spinCatchUp = 0, flickSpin = null;
const spread = () => { const [a, b] = [...pointers.values()]; return Math.max(Math.hypot(a.x - b.x, a.y - b.y), 1); };
const startPinch = () => { pinch = pointers.size === 2 ? { spread: spread(), zoom: camera.zoom } : null; };
const canvas = renderer.domElement;
// Width the pet is shown at: its frame's, else the whole canvas. Drags are measured against it.
const viewWidth = () => Math.max((activeFrame(canvas.clientWidth, canvas.clientHeight) || { w: canvas.clientWidth }).w, 1);
const inModelBox = e => {
  const box = window.tomodoomTouchBox, x = e.clientX / canvas.clientWidth, y = e.clientY / canvas.clientHeight;
  return !!box && x >= box.left && x < box.right && y >= box.top && y < box.bottom;
};
// Signed finger speed over the last moments of the drag; 0 once the finger has been held still.
function swipeSpeed(now) {
  spin.samples = spin.samples.filter(s => now - s.time <= SPEED_WINDOW_MS);
  if (spin.samples.length < 2) return 0;
  const first = spin.samples[0], latest = spin.samples[spin.samples.length - 1];
  return (latest.x - first.x) / Math.max(latest.time - first.time, 1) * 1000 / viewWidth();
}
// Speed at release: measured up to the last move (pointerup often lands a little later), 0 if held still.
function releaseSpeed(upTime) {
  const lastTime = spin.samples[spin.samples.length - 1].time;
  return upTime - lastTime > STILL_MS ? 0 : swipeSpeed(lastTime);
}
// Horizontal finger speed over the same window, in CSS px per second.
function fingerPxPerSec() {
  const s = spin.samples;
  if (s.length < 2) return 0;
  return Math.abs(s[s.length - 1].x - s[0].x) / Math.max(s[s.length - 1].time - s[0].time, 1) * 1000;
}
const swipeGain = speed => THREE.MathUtils.lerp(SLOW_GAIN, FAST_GAIN, THREE.MathUtils.smoothstep(Math.abs(speed), SLOW_SPEED, FAST_SPEED));
canvas.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  startPinch();
  spinVelocity = 0;
  flickSpin = null;  // a touch catches the pet mid-spin
  spin = pointers.size === 1 && inModelBox(e)  // a second finger ends the turn
    ? { id: e.pointerId, x: e.clientX, x0: e.clientX, start: e.timeStamp, startYaw: pet.rotation.y, pending: 0, samples: [{ x: e.clientX, time: e.timeStamp }] } : null;
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (spin && spin.id === e.pointerId) {
    spin.samples.push({ x: e.clientX, time: e.timeStamp });
    const widths = (e.clientX - spin.x) / viewWidth();
    const delta = widths * Math.PI * 2 * swipeGain(swipeSpeed(e.timeStamp));
    spin.x = e.clientX;
    if (e.timeStamp - spin.start < FLICK_WINDOW_MS && fingerPxPerSec() >= FLICK_PX_PER_SEC * FLICK_HOLD_FRACTION) {
      spin.pending += delta;  // may still be a tab flick: hold the turn
    } else {
      spinCatchUp += spin.pending;  // a turn after all: ease the held part in
      spin.pending = 0;
      pet.rotation.y += delta;
    }
  }
  if (!pinch) return;
  camera.zoom = THREE.MathUtils.clamp(pinch.zoom * spread() / pinch.spread, MIN_ZOOM, MAX_ZOOM);
  camera.updateProjectionMatrix();
});
for (const type of ['pointerup', 'pointercancel']) canvas.addEventListener(type, e => {
  pointers.delete(e.pointerId);
  startPinch();
  if (!spin || spin.id !== e.pointerId) return;
  if (type === 'pointercancel') {  // a quick flick went to the tab pager: drop the held turn, spin once
    spinVelocity = 0;
    if (e.timeStamp - spin.start < TAB_HANDOVER_MS) {
      const dir = Math.sign(spin.x - spin.x0) || 1;
      spinCatchUp = 0;
      flickSpin = { from: pet.rotation.y, to: spin.startYaw + dir * Math.PI * 2, t: 0 };
    }
  } else {
    spinCatchUp += spin.pending;  // released on the pet: a quick flick still turns it, smoothly
    const speed = releaseSpeed(e.timeStamp), release = speed * Math.PI * 2 * swipeGain(speed);
    spinVelocity = Math.abs(release) < MIN_FLING ? 0 : THREE.MathUtils.clamp(release, -MAX_FLING, MAX_FLING);
  }
  spin = null;
});

// --- Idle animation per mood; eased so mood changes blend ---
const goal = { y: 0, tip: 0, droop: 0, squash: 1 };
let last = performance.now();
function frame(now) {
  const t = now / 1000, dt = Math.max(0, Math.min(now - last, 100)) / 1000, k = 1 - Math.exp(-dt * 6);  // a slow first render can leave now < last
  last = now;
  if (flickSpin) {  // one full turn after a tab flick (easeOutCubic), ending where the drag began
    flickSpin.t = Math.min(flickSpin.t + dt / FLICK_SPIN_SEC, 1);
    pet.rotation.y = THREE.MathUtils.lerp(flickSpin.from, flickSpin.to, 1 - Math.pow(1 - flickSpin.t, 3));
    if (flickSpin.t === 1) flickSpin = null;
  }
  if (spinCatchUp) {  // ease in a held turn
    const step = Math.abs(spinCatchUp) < .001 ? spinCatchUp : spinCatchUp * (1 - Math.exp(-dt * CATCH_UP_RATE));
    pet.rotation.y += step;
    spinCatchUp -= step;
  }
  if (!spin && spinVelocity) {  // coast after a flick
    pet.rotation.y += spinVelocity * dt;
    spinVelocity *= Math.exp(-dt * FLING_DECAY);
    if (Math.abs(spinVelocity) < .02) spinVelocity = 0;
  }
  if (mood === 'thriving') Object.assign(goal, { y: Math.abs(Math.sin(t * 3)) * .12, tip: 0, droop: -.05, squash: 1 });
  else if (mood === 'struggling') Object.assign(goal, { y: Math.sin(t * .9) * .01, tip: 0, droop: .3, squash: .97 });
  else if (mood === 'fainted') Object.assign(goal, { y: 0, tip: 1.35, droop: .4, squash: 1 });
  else Object.assign(goal, { y: 0, tip: 0, droop: Math.sin(t * 1.3) * .03, squash: 1 + Math.sin(t * 2) * .012 });
  pet.position.y = THREE.MathUtils.lerp(pet.position.y, petBox.min.y + goal.y, mood === 'thriving' ? 1 : k);
  pet.rotation.z = THREE.MathUtils.lerp(pet.rotation.z, goal.tip, k * .5);
  pet.scale.y = THREE.MathUtils.lerp(pet.scale.y, goal.squash, k);
  head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, goal.droop, k);
  renderer.render(scene, camera);
}
const run = () => renderer.setAnimationLoop(document.hidden ? null : frame);
document.addEventListener('visibilitychange', run);
run();
</script>
<script>
  // Module errors (e.g. no WebGL) don't reach the app; show a hint instead of a blank viewport.
  addEventListener('error', function (e) {
    document.getElementById('error').textContent = 'Pet failed to load: ' + (e.message || e);
  });
</script>
</body>
</html>
