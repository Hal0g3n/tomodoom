<!doctype html>
<!--
  Tomodoom pet page (CLAUDE.md §5.1). The rabbit comes from the Maniengine export scene-3.html:
  pet-model.js is GENERATED from it by tools/maniengine/extract_model.py (don't edit it by hand).
  This page owns the camera, lighting loop and the app contract:
    - reads window.tomodoomPetState at startup and listens for "tomodoom:petstate";
    - mood drives the idle animation, equipped items toggle the add-ons below.
  tomodoom-touch "centre": one-finger drags starting in the centre turn the rabbit; those starting on
  the side edges or bottom strip swipe between tabs. Two fingers pinch-zoom (the host keeps multi-touch
  gestures away from the tab pager).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="tomodoom-touch" content="centre">
  <title>Tomodoom pet</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; transition: filter .6s; touch-action: none; }
    #error { position: absolute; inset: auto 0 12px; text-align: center; font: 13px sans-serif;
      color: #8C8F92; }
  </style>
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
</head>
<body>
<div id="error"></div>
<script type="module">
import * as THREE from 'three';
import { buildPetScene } from './pet-scene.js';

// --- Scene, built exactly as the export does it (camera first, so override child paths match) ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 100);
scene.add(camera);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const { rabbit, head, rabbitBox, ADDONS } = buildPetScene(THREE, scene, renderer);

// --- App contract: tomodoom:petstate ---
let mood = 'okay';
function applyState(s) {
  if (!s) return;
  mood = s.fainted ? 'fainted' : s.mood;
  const ids = Object.values(s.equipped || {}).map(item => item.id);
  for (const id in ADDONS) ADDONS[id].visible = ids.includes(id);
  renderer.domElement.style.filter = { struggling: 'saturate(.55)', fainted: 'grayscale(.85)' }[mood] || '';
}
addEventListener('tomodoom:petstate', e => applyState(e.detail));
applyState(window.tomodoomPetState);

// --- Camera: frame the rabbit (+ the near rug) for whatever aspect the viewport has ---
const TALL_ASPECT = .8, TALL_DROP = .08, MIN_ZOOM = .75, MAX_ZOOM = 3;
function fit() {
  const w = document.documentElement.clientWidth, h = document.documentElement.clientHeight;
  if (!w || !h) return;  // detached while moving between pages: keep the last good framing
  const size = rabbitBox.getSize(new THREE.Vector3()), centre = rabbitBox.getCenter(new THREE.Vector3());
  camera.aspect = w / h;
  const vFov = THREE.MathUtils.degToRad(camera.fov) / 2;
  const fitH = (size.y * .75) / Math.tan(vFov), fitW = (size.x * 1.1) / (Math.tan(vFov) * camera.aspect);
  const dist = Math.max(fitH, fitW, 2.5);
  camera.position.set(0, centre.y + dist * .18, centre.z + dist);
  camera.lookAt(0, centre.y - size.y * .08, centre.z);
  // Tall (full-page) viewports: sit the rabbit lower, clear of the HP card floating at the top.
  if (camera.aspect < TALL_ASPECT) camera.setViewOffset(w, h, 0, -h * TALL_DROP, w, h);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  renderer.render(scene, camera);  // same frame as the resize, so no frame shows the old aspect
}
new ResizeObserver(fit).observe(document.documentElement);
fit();

// --- Touch: one finger in the centre turns the rabbit; two fingers pinch to zoom ---
// camera.zoom scales the picture uniformly, so the model is never distorted.
// TAB_EDGE and TAB_BOTTOM mirror ManiengineProtocol: outside the centre, drags belong to the tab pager.
const TAB_EDGE = .15, TAB_BOTTOM = .2, MAX_FLING = 10, FLING_DECAY = 4, FLING_STALE_MS = 80;
const pointers = new Map();
let pinch = null, spin = null, spinVelocity = 0;
const spread = () => { const [a, b] = [...pointers.values()]; return Math.max(Math.hypot(a.x - b.x, a.y - b.y), 1); };
const startPinch = () => { pinch = pointers.size === 2 ? { spread: spread(), zoom: camera.zoom } : null; };
const canvas = renderer.domElement;
const inCentre = e => e.clientX >= canvas.clientWidth * TAB_EDGE && e.clientX < canvas.clientWidth * (1 - TAB_EDGE)
  && e.clientY < canvas.clientHeight * (1 - TAB_BOTTOM);
canvas.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  startPinch();
  spinVelocity = 0;
  spin = pointers.size === 1 && inCentre(e) ? { id: e.pointerId, x: e.clientX, time: e.timeStamp } : null;  // a second finger ends the turn
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (spin && spin.id === e.pointerId) {
    const turn = (e.clientX - spin.x) / Math.max(canvas.clientWidth, 1) * Math.PI * 2;  // one viewport width = one full turn
    rabbit.rotation.y += turn;
    spinVelocity = THREE.MathUtils.clamp(turn / Math.max(e.timeStamp - spin.time, 1) * 1000, -MAX_FLING, MAX_FLING);
    spin.x = e.clientX;
    spin.time = e.timeStamp;
  }
  if (!pinch) return;
  camera.zoom = THREE.MathUtils.clamp(pinch.zoom * spread() / pinch.spread, MIN_ZOOM, MAX_ZOOM);
  camera.updateProjectionMatrix();
});
for (const type of ['pointerup', 'pointercancel']) canvas.addEventListener(type, e => {
  pointers.delete(e.pointerId);
  startPinch();
  if (!spin || spin.id !== e.pointerId) return;
  if (type === 'pointercancel' || e.timeStamp - spin.time > FLING_STALE_MS) spinVelocity = 0;  // held still before lifting: no coast
  spin = null;
});

// --- Idle animation per mood; eased so mood changes blend ---
const goal = { y: 0, tip: 0, droop: 0, squash: 1 };
let last = performance.now();
function frame(now) {
  const t = now / 1000, dt = Math.max(0, Math.min(now - last, 100)) / 1000, k = 1 - Math.exp(-dt * 6);  // a slow first render can leave now < last
  last = now;
  if (!spin && spinVelocity) {  // coast after a flick
    rabbit.rotation.y += spinVelocity * dt;
    spinVelocity *= Math.exp(-dt * FLING_DECAY);
    if (Math.abs(spinVelocity) < .02) spinVelocity = 0;
  }
  if (mood === 'thriving') Object.assign(goal, { y: Math.abs(Math.sin(t * 3)) * .12, tip: 0, droop: -.05, squash: 1 });
  else if (mood === 'struggling') Object.assign(goal, { y: Math.sin(t * .9) * .01, tip: 0, droop: .3, squash: .97 });
  else if (mood === 'fainted') Object.assign(goal, { y: 0, tip: 1.35, droop: .4, squash: 1 });
  else Object.assign(goal, { y: 0, tip: 0, droop: Math.sin(t * 1.3) * .03, squash: 1 + Math.sin(t * 2) * .012 });
  rabbit.position.y = THREE.MathUtils.lerp(rabbit.position.y, rabbitBox.min.y + goal.y, mood === 'thriving' ? 1 : k);
  rabbit.rotation.z = THREE.MathUtils.lerp(rabbit.rotation.z, goal.tip, k * .5);
  rabbit.scale.y = THREE.MathUtils.lerp(rabbit.scale.y, goal.squash, k);
  head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, goal.droop, k);
  renderer.render(scene, camera);
}
const run = () => renderer.setAnimationLoop(document.hidden ? null : frame);
document.addEventListener('visibilitychange', run);
run();
</script>
<script>
  // Module errors (e.g. no WebGL) don't reach the app; show a hint instead of a blank viewport.
  addEventListener('error', function (e) {
    document.getElementById('error').textContent = 'Pet failed to load: ' + (e.message || e);
  });
</script>
</body>
</html>
