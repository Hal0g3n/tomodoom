<!doctype html>
<!-- Renders each pet add-on alone, and each pet (PETS) whole as pet_<id>, to transparent PNGs.
     Driven by make_thumbnails.py; not shipped. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <script type="importmap">{ "imports": { "three": "/app/src/main/assets/maniengine/vendor/three/three.module.js" } }</script>
</head>
<body>
<pre id="out"></pre>
<script>
  addEventListener('error', e => { document.getElementById('out').textContent = 'ERROR ' + e.message; });
</script>
<script type="module">
import * as THREE from 'three';
import { buildPetScene, loadPetModel, DEFAULT_PET, PETS } from '/app/src/main/assets/maniengine/pet-scene.js';

const SIZE = 384, VIEW = new THREE.Vector3(.45, .35, 1).normalize();
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, .01, 100);
scene.add(camera);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
const { id: petId, model } = await loadPetModel(DEFAULT_PET);  // thumbnails show the default pet's fit
const { ADDONS } = buildPetScene(THREE, scene, renderer, model, petId);
scene.background = null;
scene.fog = null;
renderer.setClearColor(0x000000, 0);

// Hide the pet and the rug, but keep the groups: add-ons are parented to them.
const parts = new Set();
for (const id in ADDONS) ADDONS[id].traverse(o => parts.add(o));
scene.traverse(o => { if (o.isMesh && !parts.has(o)) o.visible = false; });

const out = {};
for (const id in ADDONS) {
  for (const other in ADDONS) ADDONS[other].visible = other === id;
  scene.updateMatrixWorld(true);
  const sphere = new THREE.Box3().setFromObject(ADDONS[id]).getBoundingSphere(new THREE.Sphere());
  const dist = sphere.radius * 1.08 / Math.sin(THREE.MathUtils.degToRad(camera.fov) / 2);
  camera.position.copy(sphere.center).addScaledVector(VIEW, dist);
  camera.lookAt(sphere.center);
  renderer.render(scene, camera);
  out[id] = renderer.domElement.toDataURL('image/png');
}

// Onboarding portraits: each pet whole, on its rug, without add-ons, in a fresh scene.
const PORTRAIT_VIEW = new THREE.Vector3(.35, .3, 1).normalize();
for (const id in PETS) {
  const s = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, .01, 100);
  s.add(cam);
  const built = buildPetScene(THREE, s, renderer, (await loadPetModel(id)).model, id);
  for (const a in built.ADDONS) built.ADDONS[a].visible = false;
  s.background = null;
  s.fog = null;
  s.updateMatrixWorld(true);
  const sphere = built.petBox.getBoundingSphere(new THREE.Sphere());
  const dist = sphere.radius * 1.05 / Math.sin(THREE.MathUtils.degToRad(cam.fov) / 2);
  cam.position.copy(sphere.center).addScaledVector(PORTRAIT_VIEW, dist);
  cam.lookAt(sphere.center);
  renderer.render(s, cam);
  out['pet_' + id] = renderer.domElement.toDataURL('image/png');
}
document.getElementById('out').textContent = JSON.stringify(out);
</script>
</body>
</html>
