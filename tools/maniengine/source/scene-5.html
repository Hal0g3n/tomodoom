// Painted fur markings complement the raised forehead and cheek stripes.
function tabbyCoatTexture(tail = false) {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 256;
  const context = canvas.getContext('2d');
  context.fillStyle = '#ffffff'; context.fillRect(0, 0, 512, 256);
  context.fillStyle = '#59616d';
  if (tail) {
    for (let i = 0; i < 5; i++) context.fillRect(45 + i * 100, 0, 44, 256);
    context.fillRect(474, 0, 38, 256);
  } else {
    for (let i = 0; i < 10; i++) {
      const x = i * 54;
      context.beginPath(); context.moveTo(x - 10, 0);
      context.bezierCurveTo(x + 24, 42, x - 22, 90, x + 9, 156);
      context.bezierCurveTo(x - 5, 99, x + 5, 44, x + 12, 0);
      context.closePath(); context.fill();
    }
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}
